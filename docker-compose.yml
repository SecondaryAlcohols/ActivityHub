name: event-system

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: event_system
      MYSQL_USER: event
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eventpass}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: mysql+aiomysql://event:${MYSQL_PASSWORD:-eventpass}@mysql:3306/event_system?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      TICKET_SECRET: ${TICKET_SECRET:-change-me-ticket-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ATTENDEE_TOKEN_EXPIRE_DAYS: 7
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MOCK_LOGIN: "false"
      CORS_ORIGINS: '["http://localhost:8080"]'
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  admin-web:
    build:
      context: ./admin-web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8080:80"
    restart: unless-stopped

  web-app:
    build:
      context: ./web-app
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  mysql_data:
