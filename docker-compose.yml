services:
  db:
    image: postgres:18-alpine
    container_name: activityhub-db
    environment:
      POSTGRES_DB: activityhub
      POSTGRES_USER: activityhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-activityhub}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activityhub -d activityhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: activityhub-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://activityhub:${POSTGRES_PASSWORD:-activityhub}@db:5432/activityhub
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-please-change-me}
      TZ: Asia/Shanghai
      CORS_ORIGINS: "*"
      FACE_PROVIDER: stub
      TRUST_PROXY_HEADERS: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
