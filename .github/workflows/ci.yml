name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: activityhub
          POSTGRES_PASSWORD: activityhub
          POSTGRES_DB: activityhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activityhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://activityhub:activityhub@127.0.0.1:5432/activityhub_test
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-with-enough-length-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -e ".[dev]"

      - name: 代码风格检查
        run: ruff check app tests scripts

      - name: 运行测试
        run: pytest -q
